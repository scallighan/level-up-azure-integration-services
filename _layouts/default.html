<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0969da">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>
      {% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}
    </title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header" role="banner">
      <div class="site-header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}">
          Azure Integration Services Workshop
        </a>
        <nav class="site-nav" aria-label="Workshop navigation">
          <a href="{{ '/docs/prerequisites.html' | relative_url }}">Prerequisites</a>
          <a href="{{ '/labs/01-crud-integration/' | relative_url }}">Lab 1</a>
          <a href="{{ '/labs/02-topic-fanout/' | relative_url }}">Lab 2</a>
          <a href="{{ '/docs/coaches-guide.html' | relative_url }}">Coaches</a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="main-content" role="main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <span>Agentic Azure Integration Services Development</span>
        <a href="https://github.com/{{ site.repository }}">View source on GitHub</a>
      </div>
    </footer>
  </body>
</html>
