openapi: 3.0.3
info:
  title: Deployment Region Transformation API
  version: 3.0.0
  description: Preserve request details and replace region labels with trusted Cosmos lookup values. No resources are provisioned.
paths:
  /region-lookup:
    post:
      operationId: lookupRegion
      summary: Transform a deployment request using a region lookup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegionRequest"
            example:
              requestId: REQ-1042
              workloadName: inventory-api
              instanceCount: 2
              programmaticName: westus
              regionDisplayName: unresolved
              physicalLocation: unresolved
      responses:
        "200":
          description: Region found and payload transformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionResponse"
              example:
                requestId: REQ-1042
                workloadName: inventory-api
                instanceCount: 2
                programmaticName: westus
                regionDisplayName: West US
                physicalLocation: California
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: InvalidRequest
                message: Supply a valid deployment request.
        "404":
          description: No lookup record for this programmatic name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: RegionNotFound
                message: No region lookup was found.
        "503":
          description: Cosmos lookup failed after bounded retries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: LookupUnavailable
                message: The region lookup is temporarily unavailable.
        "500":
          description: Unexpected workflow failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: InternalError
                message: The request could not be processed.
components:
  schemas:
    RegionRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - workloadName
        - instanceCount
        - programmaticName
        - regionDisplayName
        - physicalLocation
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 40
        workloadName:
          type: string
          minLength: 1
          maxLength: 80
        instanceCount:
          type: integer
          minimum: 1
        programmaticName:
          type: string
          minLength: 2
          maxLength: 40
          pattern: "^[a-z][a-z0-9]+$"
        regionDisplayName:
          type: string
          description: Unverified incoming label; always replaced by the lookup's displayName.
        physicalLocation:
          type: string
          description: Unverified incoming location; always replaced by the lookup's physicalLocation.
    RegionResponse:
      type: object
      additionalProperties: false
      required:
        - requestId
        - workloadName
        - instanceCount
        - programmaticName
        - regionDisplayName
        - physicalLocation
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 40
        workloadName:
          type: string
          minLength: 1
          maxLength: 80
        instanceCount:
          type: integer
          minimum: 1
        programmaticName:
          type: string
          minLength: 2
          maxLength: 40
          pattern: "^[a-z][a-z0-9]+$"
        regionDisplayName:
          type: string
          minLength: 1
        physicalLocation:
          type: string
          minLength: 1
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - InvalidRequest
            - RegionNotFound
            - LookupUnavailable
            - InternalError
        message:
          type: string
          minLength: 1
