openapi: 3.0.3
info:
  title: Region Lookup API
  version: 2.0.0
  description: Enrich a programmatic Azure region name with a physical location from Cosmos DB.
paths:
  /region-lookup:
    post:
      operationId: lookupRegion
      summary: Look up a region's physical location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegionRequest"
            example:
              programmaticName: westus
      responses:
        "200":
          description: Region found and payload transformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionResponse"
              example:
                programmaticName: westus
                physicalLocation: California
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: InvalidRequest
                message: Supply a valid programmaticName.
        "404":
          description: No lookup record for this programmatic name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: RegionNotFound
                message: No region lookup was found.
        "503":
          description: Cosmos lookup failed after bounded retries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: LookupUnavailable
                message: The region lookup is temporarily unavailable.
        "500":
          description: Unexpected workflow failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: InternalError
                message: The request could not be processed.
components:
  schemas:
    RegionRequest:
      type: object
      additionalProperties: false
      required:
        - programmaticName
      properties:
        programmaticName:
          type: string
          minLength: 2
          maxLength: 40
          pattern: "^[a-z][a-z0-9]+$"
    RegionResponse:
      type: object
      additionalProperties: false
      required:
        - programmaticName
        - physicalLocation
      properties:
        programmaticName:
          type: string
        physicalLocation:
          type: string
          minLength: 1
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - InvalidRequest
            - RegionNotFound
            - LookupUnavailable
            - InternalError
        message:
          type: string
          minLength: 1
