openapi: 3.0.3
info:
  title: Deployment Lookup Transformation API
  version: 4.0.0
  description: Preserve request details and add region and synthetic support-tier details from Cosmos. No resources are provisioned.
paths:
  /region-lookup:
    post:
      operationId: lookupRegion
      summary: Enrich a deployment request using region and support-tier lookups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegionRequest"
            example:
              requestId: REQ-1042
              workloadName: inventory-api
              instanceCount: 2
              programmaticName: westus
              supportTier: standard
      responses:
        "200":
          description: Both lookups found and payload enriched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionResponse"
              example:
                requestId: REQ-1042
                workloadName: inventory-api
                instanceCount: 2
                programmaticName: westus
                supportTier: standard
                regionDisplayName: West US
                physicalLocation: California
                supportTierDisplayName: Standard
                responseTimeHours: 8
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: InvalidRequest
                message: Supply a valid deployment request.
        "404":
          description: No lookup record for the region or support tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: RegionNotFound
                message: No region lookup was found.
        "503":
          description: Cosmos lookup failed after bounded retries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: LookupUnavailable
                message: A lookup is temporarily unavailable.
        "500":
          description: Unexpected workflow failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: InternalError
                message: The request could not be processed.
components:
  schemas:
    RegionRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - workloadName
        - instanceCount
        - programmaticName
        - supportTier
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 40
        workloadName:
          type: string
          minLength: 1
          maxLength: 80
        instanceCount:
          type: integer
          minimum: 1
        programmaticName:
          type: string
          minLength: 2
          maxLength: 40
          pattern: "^[a-z][a-z0-9]+$"
        supportTier:
          type: string
          minLength: 2
          maxLength: 40
          pattern: "^[a-z][a-z0-9]+$"
          description: Synthetic support-tier lookup key, independent of the region.
    RegionResponse:
      type: object
      additionalProperties: false
      required:
        - requestId
        - workloadName
        - instanceCount
        - programmaticName
        - supportTier
        - regionDisplayName
        - physicalLocation
        - supportTierDisplayName
        - responseTimeHours
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 40
        workloadName:
          type: string
          minLength: 1
          maxLength: 80
        instanceCount:
          type: integer
          minimum: 1
        programmaticName:
          type: string
          minLength: 2
          maxLength: 40
          pattern: "^[a-z][a-z0-9]+$"
        supportTier:
          type: string
          minLength: 2
          maxLength: 40
          pattern: "^[a-z][a-z0-9]+$"
        regionDisplayName:
          type: string
          minLength: 1
        physicalLocation:
          type: string
          minLength: 1
        supportTierDisplayName:
          type: string
          minLength: 1
        responseTimeHours:
          type: integer
          minimum: 1
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - InvalidRequest
            - RegionNotFound
            - SupportTierNotFound
            - LookupUnavailable
            - InternalError
        message:
          type: string
          minLength: 1
