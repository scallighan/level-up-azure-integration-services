<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Integration Workshop Items</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <h1>Workshop items</h1>
      <p>CRUD through Logic Apps and Cosmos DB, optionally using API Management.</p>

      <form id="api-form" class="panel">
        <label for="connection-mode">Connection mode</label>
        <select id="connection-mode">
          <option value="direct">Direct Logic App</option>
          <option value="gateway">API Management</option>
        </select>
        <label for="api-base">Endpoint</label>
        <div class="row">
          <input id="api-base" type="url"
            placeholder="Paste the temporary Logic App callback URL" required>
          <button type="submit">Connect</button>
        </div>
      </form>

      <form id="item-form" class="panel">
        <input id="item-id" type="hidden">
        <label for="item-name">Name</label>
        <input id="item-name" maxlength="100" required>
        <label for="item-status">Status</label>
        <select id="item-status">
          <option value="new">New</option>
          <option value="active">Active</option>
          <option value="complete">Complete</option>
        </select>
        <div class="row">
          <button type="submit">Save item</button>
          <button id="cancel-edit" type="button" class="secondary">Cancel</button>
        </div>
      </form>

      <section class="panel">
        <div class="row spread">
          <h2>Items</h2>
          <button id="refresh" type="button">Refresh</button>
        </div>
        <p id="message" role="status"></p>
        <table>
          <thead>
            <tr><th>Name</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="items"></tbody>
        </table>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
