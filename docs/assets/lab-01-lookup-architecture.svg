<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img" aria-labelledby="title description">
  <title id="title">Lab 1 region and support-tier lookups</title>
  <desc id="description">An HTTP client sends a deployment request with region and support-tier keys to the shared Logic App. Its system identity reads both records through the Cosmos private endpoint. The workflow preserves all request fields and adds region and synthetic support details.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .data { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 10; }
      .label { fill: #111827; font: 600 17px system-ui, sans-serif; text-anchor: middle; }
      .edge { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow); }
      .note { fill: #374151; font: 14px system-ui, sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <rect class="box" x="25" y="75" width="150" height="75"/>
  <text class="label" x="100" y="118">HTTP client</text>
  <rect class="box" x="315" y="75" width="180" height="75"/>
  <text class="label" x="405" y="107">Logic App</text>
  <text class="label" x="405" y="130">lab01-workflow</text>
  <rect class="box" x="625" y="75" width="160" height="75"/>
  <text class="label" x="705" y="107">Cosmos private</text>
  <text class="label" x="705" y="130">endpoint</text>
  <rect class="data" x="850" y="75" width="125" height="75"/>
  <text class="label" x="912" y="107">Cosmos DB</text>
  <text class="note" x="912" y="130">lookup records</text>
  <path class="edge" d="M 175 95 H 315"/>
  <text class="note" x="245" y="65">deployment request</text>
  <path class="edge" d="M 315 135 H 175"/>
  <text class="note" x="245" y="175">enriched JSON response</text>
  <path class="edge" d="M 495 112 H 625"/>
  <text class="note" x="560" y="65">system identity</text>
  <path class="edge" d="M 785 112 H 850"/>
  <text class="note" x="500" y="235">Reuse Lab 0 hosting, private networking, identities, and monitoring.</text>
</svg>
