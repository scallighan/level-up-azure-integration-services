<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Lab 3 workbook-to-solution process</title>
  <desc id="desc">A workbook is extracted locally, converted to an evidence-backed design proposal, approved by a person, and implemented with Bicep or Terraform as an Azure Integration Services solution.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1769aa"/>
    </marker>
    <style>
      .box { fill: #f5f9fc; stroke: #1769aa; stroke-width: 2; rx: 12; }
      .azure { fill: #e8f4ff; stroke: #0078d4; stroke-width: 2; rx: 12; }
      .gate { fill: #fff4ce; stroke: #8a6d1d; stroke-width: 2; rx: 12; }
      .label { font: 600 18px Arial, sans-serif; fill: #1f2937; text-anchor: middle; }
      .detail { font: 14px Arial, sans-serif; fill: #374151; text-anchor: middle; }
      .line { stroke: #1769aa; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="box" x="30" y="105" width="190" height="130"/>
  <text class="label" x="125" y="150">Excel workbook</text>
  <text class="detail" x="125" y="180">payloads, mappings,</text>
  <text class="detail" x="125" y="202">responses, diagrams</text>

  <line class="line" x1="220" y1="170" x2="275" y2="170"/>
  <rect class="box" x="280" y="105" width="210" height="130"/>
  <text class="label" x="385" y="145">Local extraction</text>
  <text class="detail" x="385" y="177">sheet + cell evidence</text>
  <text class="detail" x="385" y="199">facts vs assumptions</text>

  <line class="line" x1="490" y1="170" x2="545" y2="170"/>
  <rect class="box" x="550" y="105" width="210" height="130"/>
  <text class="label" x="655" y="145">Design proposal</text>
  <text class="detail" x="655" y="177">schema-valid resource graph</text>
  <text class="detail" x="655" y="199">identity + reliability</text>

  <line class="line" x1="760" y1="170" x2="815" y2="170"/>
  <rect class="gate" x="820" y="105" width="150" height="130"/>
  <text class="label" x="895" y="150">Approval gate</text>
  <text class="detail" x="895" y="182">resolve required</text>
  <text class="detail" x="895" y="204">assumptions</text>

  <line class="line" x1="970" y1="170" x2="1025" y2="170"/>
  <rect class="azure" x="1030" y="75" width="150" height="190"/>
  <text class="label" x="1105" y="118">Azure solution</text>
  <text class="detail" x="1105" y="150">Bicep or Terraform</text>
  <text class="detail" x="1105" y="180">Logic App Standard</text>
  <text class="detail" x="1105" y="202">approved services</text>
  <text class="detail" x="1105" y="224">tests + telemetry</text>
</svg>
